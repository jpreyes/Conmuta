<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Conmuta symbol</title>
  <desc id="desc">Soft circular engineering mark with cyan and coral flowing currents, inspired by the koi-flow visual language.</desc>
  <defs>
    <radialGradient id="core" cx="42%" cy="36%" r="68%">
      <stop offset="0" stop-color="#9FEFF1"/>
      <stop offset=".42" stop-color="#168EAA"/>
      <stop offset=".76" stop-color="#0A526C"/>
      <stop offset="1" stop-color="#062538"/>
    </radialGradient>
    <linearGradient id="cyan" x1="78" y1="76" x2="420" y2="426" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C7F6EF"/>
      <stop offset=".48" stop-color="#31C3CE"/>
      <stop offset="1" stop-color="#07546D"/>
    </linearGradient>
    <linearGradient id="coral" x1="424" y1="80" x2="110" y2="436" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFE1D3"/>
      <stop offset=".55" stop-color="#FF9B7D"/>
      <stop offset="1" stop-color="#EF6C5A"/>
    </linearGradient>
    <filter id="shadow" x="-22%" y="-22%" width="144%" height="152%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#062538" flood-opacity=".18"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <circle cx="256" cy="256" r="156" fill="url(#core)"/>
    <circle cx="204" cy="180" r="76" fill="#FFFFFF" opacity=".14"/>
    <path d="M256 54A202 202 0 0 0 80 350" fill="none" stroke="url(#cyan)" stroke-width="34" stroke-linecap="round"/>
    <path d="M256 458A202 202 0 0 0 432 162" fill="none" stroke="url(#coral)" stroke-width="34" stroke-linecap="round"/>
    <path d="M148 308C190 360 276 376 342 332C380 306 404 268 414 222C368 258 318 270 264 254C214 240 174 254 148 308Z" fill="#E9FFFF" opacity=".38"/>
    <path d="M140 206C178 154 258 130 332 166C366 182 390 207 406 238C350 214 294 220 250 248C210 274 172 268 140 206Z" fill="#FFB099" opacity=".3"/>
    <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round" opacity=".94">
      <path d="M164 270C206 206 296 184 356 230" stroke-width="24"/>
      <path d="M172 310C218 338 282 340 334 306" stroke-width="18" opacity=".86"/>
